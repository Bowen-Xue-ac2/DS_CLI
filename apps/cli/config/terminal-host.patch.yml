- id: directory-picker
  disabled: true
- id: workspace-changes
  config:
    timeoutMs: 2500
    outputMaxBytes: 1048576
    maxFiles: 150
    maxFileBytes: 1048576
    diffTimeoutMs: 100
- insert:
    - id: terminal-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ds-cli-cwd
      name: ../lib/terminal-cwd.js
    - id: ds-cli-connector-catalog
      name: ../lib/terminal-connector-catalog.js
    - id: ds-cli-browser-handoff
      name: ./browser-handoff/index.js
